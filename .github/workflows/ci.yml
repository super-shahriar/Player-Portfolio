name: Backend MongoDB CI

on:
  push:
    # Triggers on every commit to any branch...
    branches:
      - '**'
    # ...BUT only if files in the backend folder or this specific workflow changed
    paths:
      - 'backend/**'
      - '.github/workflows/backend-db.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'backend/**'

jobs:
  test-mongodb:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-asyncio  # Required for async tests

      - name: Run MongoDB tests
        working-directory: backend
        env:
          # These override your app/core/config.py settings for the CI environment
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB_NAME: test_db
          PYTHONPATH: ${{ github.workspace }}/backend
        # We specify the exact test file to keep it focused
        run: pytest tests/test_mongodb.py -v

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -q
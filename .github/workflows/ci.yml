name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            python - <<'PY' && break || true
import sys
from pymongo import MongoClient
try:
    MongoClient('mongodb://localhost:27017', serverSelectionTimeoutMS=2000).server_info()
    print('Mongo readyyyyyyyyyyyyyyyyyyyyyy')
    sys.exit(0)
except Exception:
    sys.exit(1)
PY
            sleep 1
          done

      - name: Run tests
        working-directory: backend
        run: |
          pytest -q
